<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Предел — idle-игра про математику</title>
<style>
:root{--h:38;--bg:#0d1230;--bg2:#141b45;--pan:#1a2354;--line:rgba(255,255,255,.09);--tx:#e8ebf8;--mut:#98a1c8;
--ac:hsl(var(--h),82%,64%);--acs:hsla(var(--h),85%,60%,.16);--ink:#0c1129}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overscroll-behavior:none}
body{font:15px/1.35 system-ui,Roboto,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;
background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:26px 26px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top)}
#top{padding:8px 16px 6px;background:linear-gradient(var(--bg) 70%,transparent);position:relative;z-index:5}
.row1{display:flex;justify-content:space-between;align-items:baseline;color:var(--mut);font-size:13px}
#kVal{font:600 38px/1.1 Georgia,"Times New Roman",serif;color:var(--tx);letter-spacing:-.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cps{color:var(--ac);font-weight:600}
#goal{font-size:12.5px;color:var(--mut);margin-top:2px;min-height:16px}
#buffs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;min-height:0}
.chip{background:var(--acs);color:var(--ac);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 12px 14px;-webkit-overflow-scrolling:touch}
.tab{display:none}.tab.on{display:block}
#nav{display:grid;grid-template-columns:repeat(6,1fr);background:#0a0f27;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button{padding:7px 0 6px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;border-top:2px solid transparent}
#nav button b{font:400 21px/1.1 Georgia,serif}#nav button span{font-size:10.5px}
#nav button.on{color:var(--ac);border-top-color:var(--ac)}
#nav button.dot::after{content:"";position:absolute;top:6px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:#ff6b8b}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.mut{color:var(--mut);font-size:13px}
.h{font:600 17px Georgia,serif;margin-bottom:4px}
.big2{font:600 26px Georgia,serif}
.hint{border-color:var(--ac);background:var(--acs);font-size:14px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;margin:6px 0 10px;gap:2px}
.seg button{flex:1;padding:8px 2px;border-radius:9px;color:var(--mut);font-size:13px}
.seg button.on{background:var(--pan);color:var(--tx);box-shadow:0 0 0 1px var(--line)}
#proof{display:flex;flex-direction:column;align-items:center;justify-content:center;width:158px;height:158px;border-radius:50%;margin:6px auto 14px;
background:radial-gradient(circle at 35% 28%,hsl(var(--h),92%,78%),hsl(var(--h),72%,50%) 52%,hsl(var(--h),60%,24%));
box-shadow:0 0 0 7px var(--acs),0 10px 44px hsla(var(--h),85%,55%,.38);color:var(--ink);transition:transform .07s;touch-action:manipulation}
#proof.press{transform:scale(.93)}
#pg{font:600 54px/1 Georgia,serif}#pg.long{font-size:34px}
.pt{font-size:13px;font-weight:600;margin-top:4px;opacity:.75}
.gen{position:relative;display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px;margin-bottom:8px;overflow:hidden}
.gen.lock{opacity:.5}
.gsym{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--acs);color:var(--ac);font:600 21px Georgia,serif}
.gsym.long{font-size:13px}
.gname{font-weight:600;font-size:15px}.gcnt{color:var(--ac);font-family:Georgia,serif;margin-left:4px}
.gdesc{color:var(--mut);font-size:12px;margin-top:1px}.gstat{font-size:12px;margin-top:3px;color:var(--tx);opacity:.85}
.gbar{position:absolute;left:0;bottom:0;height:3px;background:var(--ac);opacity:.8;width:0}
.buy{min-width:94px;padding:8px 10px;border-radius:10px;background:var(--bg2);color:var(--mut);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;font-size:12.5px;line-height:1.25}
.buy .cost{font-weight:600;font-size:13.5px}
.buy.can{background:var(--ac);color:var(--ink);border-color:transparent}
.buy:disabled{opacity:.55}
.up{display:flex;gap:10px;align-items:center;justify-content:space-between}
.up .ut{flex:1}
.shop .st{display:flex;justify-content:space-between;align-items:baseline}.shop .lv{color:var(--ac);font-size:13px}
.shop .eff{font-size:12.5px;margin:3px 0 8px;color:var(--ac)}
.shop .buy{width:100%;flex-direction:row;justify-content:space-between}
.btn{padding:11px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-weight:600;width:100%;margin-top:6px}
.btn.pri{background:var(--ac);color:var(--ink);border-color:transparent}
.btn.dis{opacity:.45}
.bar{height:7px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ac);width:0}
.ach{display:flex;gap:10px;align-items:center;opacity:.45}.ach.got{opacity:1}
.ach .ai{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);font:600 16px Georgia,serif;flex:none}
.ach.got .ai{background:var(--ac);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cc{aspect-ratio:1;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font:600 22px Georgia,serif;color:#4a5384;border:1px solid var(--line)}
.cc.got{background:var(--acs);color:var(--ac);border-color:var(--ac)}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}
.row span:last-child{font-family:Georgia,serif;color:var(--ac)}
.res h4{margin:0 0 2px;font:600 16px Georgia,serif}
.tg{display:flex;gap:6px}.tg button{flex:1;padding:9px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:13.5px}.tg button.on{border-color:var(--ac);color:var(--ac)}
#toasts{position:fixed;top:calc(8px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;pointer-events:none}
.toast{background:#0a0f27ee;border:1px solid var(--ac);color:var(--tx);padding:8px 14px;border-radius:12px;font-size:13.5px;max-width:90%;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}
.fl{position:fixed;pointer-events:none;font:600 17px Georgia,serif;color:var(--ac);text-shadow:0 1px 6px #000;z-index:40;transform:translate(-50%,-50%);animation:fl .9s ease-out forwards}
@keyframes fl{to{transform:translate(-50%,-90px);opacity:0}}
#orb{position:fixed;width:66px;height:66px;border-radius:50%;z-index:50;font:700 30px Georgia,serif;color:var(--ink);
background:radial-gradient(circle at 35% 30%,#fff,hsl(var(--h),92%,70%) 45%,hsl(var(--h),80%,45%));box-shadow:0 0 0 6px var(--acs),0 0 34px hsla(var(--h),95%,65%,.8);
animation:orb 5s ease-in-out infinite alternate}
@keyframes orb{from{transform:translate(0,0) scale(1)}to{transform:translate(24px,-30px) scale(1.12)}}
.hide{display:none!important}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(5,8,25,.76);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px}
.mod{background:var(--pan);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:430px;width:100%;max-height:84vh;overflow:auto;-webkit-user-select:text;user-select:text}
.mod h3{margin:0 0 8px;font:600 21px Georgia,serif}.mod p{margin:6px 0}
.opt{display:block;width:100%;text-align:left;padding:11px 13px;margin-top:7px;border-radius:11px;background:var(--bg2);border:1px solid var(--line)}
.opt.ok{background:#1f6b47;border-color:#3fd08a}.opt.bad{background:#7a2740;border-color:#ff6b8b}
textarea{width:100%;height:130px;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;-webkit-user-select:text;user-select:text}
.mc{display:flex;gap:10px;align-items:flex-start;opacity:.5}.mc.got{opacity:1}
.mc .mi{width:42px;height:42px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:600 19px Georgia,serif;flex:none}.mc.got .mi{background:var(--ac);color:var(--ink)}
.mc b{font-size:15px}.mc .me{color:var(--ac);font-size:12.5px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.chips button{padding:7px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13px;color:var(--mut)}.chips button.on{border-color:var(--ac);color:var(--ac)}
canvas.cv{width:100%;display:block;background:var(--bg2);border-radius:10px;border:1px solid var(--line)}
select{width:100%;padding:9px;border-radius:10px;background:var(--bg2);color:var(--tx);border:1px solid var(--line);font:inherit}
.svgbox{background:var(--bg2);border-radius:10px;padding:6px;margin:8px 0;border:1px solid var(--line)}
.stx p{margin:0 0 10px;line-height:1.45}
.sline{padding:8px 12px;font-size:13px;color:var(--mut);cursor:pointer}.sline b{color:var(--ac)}
.mod ul{margin:6px 0;padding-left:18px}.mod li{margin:3px 0}
@media (prefers-reduced-motion:reduce){#orb{animation:none}.toast{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="row1"><span>Знание</span><span id="cps">0 / с</span></div>
    <div id="kVal">0</div>
    <div id="goal"></div>
    <div id="buffs"></div>
  </header>
  <main id="view">
    <section class="tab on" id="t-theory">
      <div id="hint" class="card hint"></div>
      <div id="storyLine" class="card sline"></div>
      <button id="proof" aria-label="Доказать теорему"><span id="pg">7</span><span class="pt">доказать</span></button>
      <div class="seg" id="buyseg">
        <button data-m="1">×1</button><button data-m="10">×10</button><button data-m="100">×100</button><button data-m="max">Макс</button>
      </div>
      <div id="gens"></div>
    </section>
    <section class="tab" id="t-upg">
      <div class="mut" id="upgInfo" style="margin:8px 2px"></div>
      <div id="upgList"></div>
    </section>
    <section class="tab" id="t-sci">
      <div class="seg" id="sciseg"><button data-s="th" class="on">Теории</button><button data-s="eq">Уравнение</button><button data-s="ch">Графики</button></div>
      <div id="thPane"></div><div id="eqPane" class="hide"></div><div id="chPane" class="hide"></div>
    </section>
    <section class="tab" id="t-grow">
      <div class="seg" id="growseg"><button data-s="ax" class="on">Аксиомы</button><button data-s="par">Парадигмы</button><button data-s="uni">Вселенные</button></div>
      <div id="axPane"></div><div id="parPane" class="hide"></div><div id="uniPane" class="hide"></div>
    </section>
    <section class="tab" id="t-goals">
      <div class="seg" id="goalsseg"><button data-s="ach" class="on">Награды</button><button data-s="res">Проблемы</button><button data-s="quest">Задания</button><button data-s="math">Совет</button></div>
      <div id="achPane"></div><div id="resPane" class="hide"></div><div id="questPane" class="hide"></div><div id="mathPane" class="hide"></div>
    </section>
    <section class="tab" id="t-menu"><div id="menuPane"></div></section>
  </main>
  <nav id="nav">
    <button data-t="theory" class="on"><b>Σ</b><span>Теория</span></button>
    <button data-t="upg"><b>∂</b><span>Улучшения</span></button>
    <button data-t="sci"><b>∫</b><span>Наука</span></button>
    <button data-t="grow"><b>∞</b><span>Рост</span></button>
    <button data-t="goals"><b>∀</b><span>Цели</span></button>
    <button data-t="menu"><b>≡</b><span>Меню</span></button>
  </nav>
</div>
<div id="toasts"></div>
<button id="orb" class="hide" aria-label="Озарение"></button>
<div id="modal" class="ov hide"></div>

<script>
'use strict';
/* =====================================================================
   ПРЕДЕЛ — idle-игра про математику и информатику
   ===================================================================== */
const KEY = 'predel_save_v1';
const NOW = () => (typeof __T !== 'undefined' ? __T : Date.now());
const el = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- форматирование ---------- */
const SUF = ['', 'тыс', 'млн', 'млрд', 'трлн', 'квдр', 'квнт', 'скст', 'сптл', 'октл', 'нонл', 'децл'];
function fmt(x) {
  if (x === undefined || x === null || isNaN(x)) return '0';
  if (!isFinite(x)) return '∞';
  if (x < 0) return '−' + fmt(-x);
  if (x < 1000) {
    if (x === Math.floor(x)) return String(x);
    return x < 10 ? x.toFixed(2) : x < 100 ? x.toFixed(1) : String(Math.floor(x));
  }
  if (!S.set.sci && x < 1e36) {
    const e = Math.floor(Math.log10(x) / 3), m = x / Math.pow(10, e * 3);
    return (m < 10 ? m.toFixed(2) : m < 100 ? m.toFixed(1) : m.toFixed(0)) + ' ' + SUF[e];
  }
  const e = Math.floor(Math.log10(x)), m = x / Math.pow(10, e);
  return m.toFixed(2) + 'e' + e;
}
function fmtT(s) {
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), c = s % 60;
  if (d) return d + 'д ' + h + 'ч';
  if (h) return h + 'ч ' + m + 'м';
  if (m) return m + 'м ' + c + 'с';
  return c + 'с';
}

/* ---------- данные: генераторы ---------- */
const NG = 24;
const GEN = [
  ['Цифры', '7', 'Десять символов, из которых строится счёт.'],
  ['Натуральные числа ℕ', 'ℕ', 'Счёт, порядок и принцип индукции.'],
  ['Целые числа ℤ', 'ℤ', 'Появились ноль и отрицательные числа.'],
  ['Рациональные ℚ', 'ℚ', 'Дроби: везде плотно, но с дырами.'],
  ['Вещественные ℝ', 'ℝ', 'Полнота: у ограниченных последовательностей есть предел.'],
  ['Комплексные ℂ', 'ℂ', '√−1 теперь тоже число. Плоскость вместо прямой.'],
  ['Векторные пространства', '→', 'Линейность, базисы и размерность.'],
  ['Группы', '⊕', 'Симметрии в чистом виде.'],
  ['Кольца и поля', '⊗', 'Сложение и умножение живут вместе.'],
  ['Графы', '•–•', 'Вершины, рёбра, обходы и раскраски.'],
  ['Алгоритмы', 'O(n)', 'Как сделать быстро — и доказать, что быстрее нельзя.'],
  ['Машины Тьюринга', '⊢', 'Что вообще можно вычислить?'],
  ['Метрические пространства', 'd', 'Расстояние как аксиома.'],
  ['Гильбертовы пространства', '‹·›', 'Бесконечномерная геометрия со скалярным произведением.'],
  ['Топологические пространства', 'τ', 'Открытые множества вместо расстояний. Вот это абстракция.'],
  ['Многообразия', 'M', 'Локально плоско, глобально — как повезёт.'],
  ['Категории', '⇒', 'Объекты забыты, остались одни стрелки.'],
  ['Топосы', '⊤', 'Целые вселенные, в которых живёт своя логика.'],
  ['Гомотопические группы', 'π₁', 'Петли в пространстве и то, во что они стягиваются.'],
  ['Схемы', 'Spec', 'Геометрия, в которой точки — это простые идеалы колец.'],
  ['Когомологии', 'H*', 'Дыры пространства, переведённые на язык алгебры.'],
  ['∞-категории', '(∞,1)', 'Стрелки между стрелками между стрелками…'],
  ['Гомотопическая теория типов', 'HoTT', 'Равенство — это путь, а доказательство — это программа.'],
  ['Универсум Гротендика', 'U', 'Достаточно большое множество, чтобы вместить всю математику.']
].map((a, i) => ({ name: a[0], sym: a[1], desc: a[2], cost: 15 * Math.pow(13, i), prod: 0.4 * Math.pow(6.8, i), g: 1.15 + 0.004 * i }));
const MS = [10, 25, 50, 100, 150, 200, 300, 400, 500, 750, 1000, 1500, 2000];

/* ---------- данные: улучшения ---------- */
const UPG = [];
const UT = [[5, 20, 2, 'Лемма'], [25, 2e3, 3, 'Теорема'], [75, 1e6, 5, 'Следствие'], [200, 1e11, 10, 'Обобщение']];
GEN.forEach((g, i) => UT.forEach((t, j) => UPG.push({
  id: 'g' + i + '_' + j, t: 'gen', i, m: t[2], cost: g.cost * t[1], req: () => S.g[i] >= t[0],
  name: g.name.split(' ')[0] === 'Цифры' ? 'Цифры: ' + t[3].toLowerCase() : t[3] + ' о «' + g.name + '»',
  desc: '×' + t[2] + ' к производству «' + g.name + '»'
})));
[
  ['c1', 'click', 2, 50, 'Мел и доска', 'Клик ×2'],
  ['c2', 'pct', 0.01, 5e3, 'Дедукция', 'Клик получает +1% вашего дохода в секунду'],
  ['c3', 'click', 3, 2e5, 'Озарение в душе', 'Клик ×3'],
  ['c4', 'pct', 0.02, 5e7, 'Интуиция', 'Клик получает ещё +2% дохода в секунду'],
  ['c5', 'click', 5, 1e10, 'Вдохновение', 'Клик ×5'],
  ['c6', 'pct', 0.05, 1e14, 'Состояние потока', 'Клик получает ещё +5% дохода в секунду'],
  ['c7', 'click', 10, 1e20, 'Эврика!', 'Клик ×10'],
  ['m1', 'glob', 1.5, 5e2, 'Крепкий кофе', 'Всё производство ×1,5'],
  ['m2', 'glob', 2, 1e5, 'Тихий кабинет', 'Всё производство ×2'],
  ['m3', 'glob', 2, 1e8, 'Доступ к arXiv', 'Всё производство ×2'],
  ['m4', 'glob', 2, 1e12, 'Научный руководитель', 'Всё производство ×2'],
  ['m5', 'glob', 3, 1e16, 'Грант на пять лет', 'Всё производство ×3'],
  ['m6', 'glob', 3, 1e22, 'Суперкомпьютер', 'Всё производство ×3'],
  ['m7', 'glob', 5, 1e30, 'Квантовый компьютер', 'Всё производство ×5'],
  ['m8', 'glob', 5, 1e40, 'Международная коллаборация', 'Всё производство ×5'],
  ['m9', 'glob', 10, 1e55, 'ИИ-математик', 'Всё производство ×10'],
  ['m10', 'glob', 10, 1e75, 'Доказательства в Lean', 'Всё производство ×10'],
  ['h1', 'hotel', 1, 1e9, 'Отель Гильберта', '+0,5% к производству за каждую единицу любого генератора']
].forEach(a => UPG.push({ id: a[0], t: a[1], m: a[2], cost: a[3], name: a[4], desc: a[5] }));
const UPG_BY = {}; UPG.forEach(u => UPG_BY[u.id] = u);

/* ---------- данные: магазин аксиом ---------- */
const startK = L => L ? Math.pow(10, 2 * L + 1) : 0;
const AXU = [

let S = newState();
const axUp = id => S.axUp[id] || 0, parUp = id => S.parUp[id] || 0, uniUp = id => S.uniUp[id] || 0;

let E = null;
function recalc() {

  for (const u of UPG) {
    if (!S.upg[u.id]) continue;
    if (u.t === 'gen') E.gm[u.i] *= u.m; else if (u.t === 'click') E.cm *= u.m; else if (u.t === 'pct') E.cp += u.m;
    else if (u.t === 'glob') E.gl *= u.m; else if (u.t === 'hotel') E.hotel = true;
  }
  for (const r of RES) {
    if (!S.res[r.id]) continue;
    const f = r.fx;
    if (f.glob) E.rg *= f.glob; if (f.click) E.rc *= f.click; if (f.ax) E.ra *= f.ax; if (f.ev) E.re *= f.ev; if (f.cost) E.rcost += f.cost;
  }
  for (const m of MATHS) {
    if (!S.maths[m.id]) continue;
    const f = m.fx;
    switch (f.t) {
      case 'glob': E.rg *= f.m; break; case 'click': E.rc *= f.m; break; case 'ax': E.ra *= f.m; break; case 'ev': E.re *= f.m; break;
      case 'dur': E.rdur *= f.m; break; case 'cost': E.rcost += f.m; break; case 'ms': E.ms += f.m; break; case 'off': E.roff += f.m; break; case 'rsp': E.rsp *= f.m; break;
      case 'gens': for (let i = f.a; i <= f.b; i++) E.gm[i] *= f.m; break;
    }
  }

}

let CPS = 0, GM = 1, AC = 0, CC = 0, TO = 0;
const msF = () => 2 + 0.1 * axUp('pow') + E.ms;
function msMult(n) { let c = 0; for (const t of MS) { if (n >= t) c++; else break; } return c ? Math.pow(msF(), c) : 1; }
function unit(i) { return GEN[i].prod * msMult(S.g[i]) * E.gm[i]; }
function buffMult(k) { let m = 1; for (const b of S.buffs) if (b[k]) m *= b[k]; return m; }
function gmult() {
  const ach = AC * 0.02 * (axUp('zorn') ? 2 : 1);
  let m = (1 + 0.04 * S.axT) * (1 + 0.5 * S.parT) * (1 + 1.5 * S.uniT) * (1 + ach + 0.05 * CC) * (1 + 0.01 * Math.min(S.questsDone, 200));
  m *= Math.pow(3, uniUp('uglob')) * (1 + 0.02 * Math.sqrt(S.eq.psiT)) * (S.ending ? 2 : 1);
  m *= Math.pow(1.25, axUp('choice')) * Math.pow(2, parUp('univ')) * E.gl * E.rg;
  if (E.hotel) m *= 1 + 0.005 * TO;
  return m * buffMult('prod');
}
function recompute() {
  AC = Object.keys(S.ach).length; CC = Object.keys(S.consts).length;
  TO = 0; for (let i = 0; i < NG; i++) TO += S.g[i];
  GM = gmult();
  let s = 0; for (let i = 0; i < NG; i++) if (S.g[i]) s += S.g[i] * unit(i);

/* ---------- покупка генераторов ---------- */
const growth = i => Math.max(1.03, GEN[i].g - 0.004 * axUp('inf') - E.rcost);
function costFor(i, q) { const g = growth(i); return GEN[i].cost * Math.pow(g, S.g[i]) * (Math.pow(g, q) - 1) / (g - 1); }
function maxAff(i, budget) {
  if (budget === undefined) budget = S.k;
  const g = growth(i), base = GEN[i].cost * Math.pow(g, S.g[i]);
  if (budget < base) return 0;
  let q = Math.floor(Math.log(1 + budget * (g - 1) / base) / Math.log(g));
  q = Math.min(q, 100000);
  while (q > 0 && costFor(i, q) > budget) q--;
  return q;
}
function buyQty(i, q) { const c = costFor(i, q); if (q < 1 || S.k < c) return false; S.k -= c; S.g[i] += q; S.buys += q; if (i > S.maxGen) S.maxGen = i; return true; }

}

let autoAxT = 0, autoT = 0, achT = 0, saveT = 0, lastT = NOW(), uiT = 0;
function tick(dt) {
  recompute();
  let gain = CPS * dt;
  const ac = axUp('empty'); if (ac) gain += clickVal() * ac * dt;
  addK(gain); S.playTime += dt; eqTick(dt); histSample();
  if (S.buffs.length) { let ch = false; S.buffs.forEach(b => b.left -= dt); const n = S.buffs.length; S.buffs = S.buffs.filter(b => b.left > 0); if (S.buffs.length !== n) ch = true; if (ch) recompute(); }
  if ((autoT += dt) >= 0.5) { autoT = 0; autoBuy(); }
  if ((achT += dt) >= 1) { achT = 0; checkAch(); checkRes(); storyCheck(); }
  if ((saveT += dt) >= 20) { saveT = 0; save(); }
  if (S.set.autoAx && uniUp('uauto') && (autoAxT += dt) >= 1) { autoAxT = 0; const ag = axiomGain(); if (ag >= 1 && ag >= Math.ceil(S.axT * 0.35)) doAxiom(true); }
  if (orbLeft > 0) { if ((orbLeft -= dt) <= 0) { orbType = null; hideOrb(); } }
  else if ((evT -= dt) <= 0) { if (modalOpen()) evT = 6; else spawnOrb(); }
}
function autoBuy() {
  const lv = [parUp('auto1'), parUp('auto2'), parUp('auto3')];
  if (lv[0] || lv[1] || lv[2]) {
    for (let i = NG - 1; i >= 0; i--) {
      const tier = i < 6 ? 0 : i < 12 ? 1 : 2; if (!lv[tier]) continue;
      const q = maxAff(i, S.k * 0.3); if (q >= 1) buyQty(i, q);
    }
    recompute();
  }
  if (parUp('autoU')) { let b = false; for (const u of UPG) if (!S.upg[u.id] && upgVisible(u) && u.cost <= S.k * 0.5) { S.k -= u.cost; S.upg[u.id] = 1; b = true; } if (b) { recalc(); recompute(); } }
}
const offCap = () => (4 + 2 * axUp('reg') + 4 * parUp('lazy')) * 3600;
const offEff = () => 0.5 + 0.1 * parUp('lazy') + E.roff;
function offline(sec) {
  recompute(); const use = Math.min(sec, offCap()), gain = CPS * use * offEff();
  addK(gain); eqOffline(use); S.playTime += sec; S.buffs.forEach(b => b.left -= sec); S.buffs = S.buffs.filter(b => b.left > 0);
  recompute(); return gain;
}
function loop() {
  const t = NOW(); let dt = (t - lastT) / 1000; lastT = t; if (dt <= 0) return;
  try {
    if (dt > 5) { const g = offline(dt); if (dt > 90) modal('<h3>С возвращением!</h3><p>Вас не было ' + fmtT(dt) + '. За это время накоплено <b>' + fmt(g) + '</b> знания.</p>', [{ t: 'Отлично', cls: 'pri' }]); checkRes(); }
    else tick(dt);
    if ((uiT += dt) >= 0.2 || dt > 5) { uiT = 0; updateUI(); }
  } catch (e) { console.error(e); }
}

let mem = null;

function load(raw) {

  if (!raw) return false;
  try {
    const o = JSON.parse(raw), n = newState(); S = Object.assign(n, o);
    S.set = Object.assign({ sci: false, vib: true, autoAx: false }, o.set);
    S.eq = Object.assign(n.eq, o.eq); S.hist = Object.assign(n.hist, o.hist); S.hist.marks = S.hist.marks || []; S.hist.a = S.hist.a || [];

}

    const i = +sel.value || 0, gg = growth(i), n0 = S.g[i], N = Math.max(60, Math.ceil(n0 * 1.4)), cs = [], inc = [];
    for (let n = 0; n <= N; n += Math.max(1, Math.floor(N / 120))) { cs.push([n, Math.log10(GEN[i].cost) + n * Math.log10(gg)]); inc.push([n, Math.log10(Math.max(n, 1) * GEN[i].prod * msMult(n) * E.gm[i] * GM)]); }
    drawChart(cv, 230, { series: [{ pts: cs, color: '#ff9ec7', w: 2 }, { pts: inc, color: ACC, w: 2 }], fx: v => String(Math.round(v)), fy: lg, pl: 44, dots: [{ x: n0, y: Math.log10(GEN[i].cost) + n0 * Math.log10(gg), c: '#ff9ec7' }, { x: n0, y: Math.log10(Math.max(n0, 1) * GEN[i].prod * msMult(n0) * E.gm[i] * GM), c: ACC }] });
    cap.textContent = 'По горизонтали — сколько единиц куплено. Розовая линия — цена следующей покупки (экспонента), жёлтая — доход ступени. Ступеньки на жёлтой — рубежи ×2. Точки — вы сейчас.';
  } else if (CH === 'ax') {
    const rl = Math.log10(Math.max(S.run, 1)), m = Math.log10(axMods()), a = []; const xe = Math.max(12, Math.ceil(rl) + 1);
    for (let x = 6; x <= xe; x += 0.25) a.push([x, 0.5 * (x - Math.log10(AX_MIN)) + m]);
    drawChart(cv, 230, { series: [{ pts: [[6, 0], [xe, 0]], color: '#4a5384', w: 1.5, dash: true }, { pts: a, color: ACC, w: 2 }], fx: lg, fy: lg, x0: 6, x1: xe, dots: [{ x: Math.max(6, rl), y: 0.5 * (rl - Math.log10(AX_MIN)) + m, c: '#fff', r: 5 }] });
    cap.textContent = 'Аксиом = √(знание за забег / 1e8) × бонусы. Это прямая в логарифмическом масштабе: десять раз больше знания даёт лишь в √10 ≈ 3,2 раза больше аксиом. Штриховая линия — порог в 1 аксиому, белая точка — вы.';
  } else {
    const al = Math.log10(Math.max(S.axT, 1)), m = Math.log10(Math.pow(1.5, uniUp('upar'))), a = [], xe = Math.max(4, Math.ceil(al) + 1);
    for (let x = 1; x <= xe; x += 0.25) a.push([x, 0.6 * (x - Math.log10(PAR_MIN)) + m]);
    drawChart(cv, 230, { series: [{ pts: [[1, 0], [xe, 0]], color: '#4a5384', w: 1.5, dash: true }, { pts: a, color: '#ff9ec7', w: 2 }], fx: lg, fy: lg, x0: 1, x1: xe, dots: [{ x: Math.max(1, al), y: 0.6 * (al - Math.log10(PAR_MIN)) + m, c: '#fff', r: 5 }] });
    cap.textContent = 'Парадигм = (аксиом за парадигму / 500)^0,6 × бонусы. Степень 0,6 — премия за терпение выше, чем у аксиом, но всё ещё сублинейная. Белая точка — вы.';
  }
}

/* =====================================================================
   СЮЖЕТ
   ===================================================================== */
const allRes = () => RES.every(r => S.res[r.id]), allTh = () => THEORIES.every(t => thLevel(t.id) >= 1), allEq = () => EQS.every(e => S.eq.un[e.id]);
const finalMissing = () => { const m = []; if (S.maxGen < NG - 1) m.push('дойти до «' + GEN[NG - 1].name + '»'); if (!allRes()) m.push('решить все проблемы тысячелетия (' + Object.keys(S.res).length + ' из 7)'); if (!allTh()) m.push('активировать все теории (' + THEORIES.filter(t => thLevel(t.id) >= 1).length + ' из ' + THEORIES.length + ')'); if (!allEq()) m.push('открыть все уравнения (' + Object.keys(S.eq.un).length + ' из ' + EQS.length + ')'); return m; };
const STORY = [
  { id: 's0', t: 'Тетрадь профессора Нуля', h: 'Напишите первую цифру: нажмите большую кнопку', cond: () => true,
    x: 'В архиве института вы нашли потрёпанную тетрадь. На обложке — «Э. Нуль. Теорема Предела». Профессор исчез семь лет назад, и никто не знает, куда.\n\nПоследняя запись обрывается на полуслове: «Если довести любую последовательность до предела, на той стороне кто-то будет ждать…»\n\nВы открываете чистую страницу и пишете «1». С чего-то нужно начинать.' },
  { id: 's1', t: 'Счёт', h: 'Накопите 1 тыс. знания', cond: () => S.total >= 1e3,
    x: 'На полях профессор оставил заметку: «Математика — лестница. Каждая ступень держится на предыдущей. Не пропускай ступени. Я пропустил».\n\nВы продолжаете считать. Цифры складываются в числа, числа — в закономерности.' },
  { id: 's2', t: 'Непрерывность', h: 'Откройте «Вещественные ℝ»', cond: () => S.maxGen >= 4,
    x: 'Вещественная прямая не имеет дыр — в этом её красота. Рядом с буквой ℝ чернила другого цвета: «Я уже близко. Он слышит, когда мы считаем».\n\nКто — он? Вы листаете дальше, но дальше пусто.' },
  { id: 's3', t: 'Аксиомы', h: 'Проведите первую аксиоматизацию (вкладка «Рост»)', cond: () => S.axResets >= 1,
    x: 'Вы переписали теорию с нуля. Оказывается, аксиомы — не истины, а решения: каким должен быть мир, в котором мы работаем.\n\nНуль писал: «Выбирай аксиомы осторожно. Миры, построенные на них, потом не выпускают».' },
  { id: 's4', t: 'Мастер-уравнение', h: 'Накопите 10 млрд знания, и из тетради выпадет листок', cond: () => S.total >= 1e10,
    x: 'Из тетради выпал сложенный листок. На нём одно уравнение с пропущенными слагаемыми. На обороте: «Вселенная — динамическая система. Дорешай её, и она ответит».\n\nВо вкладке «Наука» открылась новая страница: «Уравнение».' },
  { id: 's5', t: 'Библиотека', h: 'Изучите и активируйте любую теорию (вкладка «Наука»)', cond: () => THEORIES.some(t => thLevel(t.id) >= 1),
    x: 'Институт открыл закрытые фонды. Теории — отдельные страны со своими законами, и жители разговаривают только на языке задач. Решите достаточно — вас впустят.\n\nСудя по закладкам, Нуль был здесь постоянным читателем.' },
  { id: 's6', t: 'Смена парадигмы', h: 'Совершите парадигмальный сдвиг', cond: () => S.parResets >= 1,
    x: 'Всё, что вы знали, оказалось частным случаем. Нуль называл такие моменты «землетрясениями понимания».\n\nВ тетради три подчёркнутых слова: «Я пережил три». Вы пережили одно.' },
  { id: 's7', t: 'Идеи и критики', h: 'Откройте уравнение Лотки — Вольтерры', cond: () => !!S.eq.un.lv,
    x: 'Идей становится много — приходят критики. Критиков много — идеи вымирают. И так по кругу.\n\n«Критики не враги, — написал Нуль на полях. — Без них идеи просто размножаются, а не улучшаются».' },
  { id: 's8', t: 'Совет', h: 'Соберите 8 математиков в совете', cond: () => Object.keys(S.maths).length >= 8,
    x: 'В кабинет приходят письма — от Эйлера, Нётер, Тьюринга. Подписи разные, а почерк везде один: профессора Нуля.\n\nКак будто он обошёл всех, кто стоял на плечах гигантов, и попросил: «Помогите тому, кто придёт за мной».' },
  { id: 's9', t: 'Другая вселенная', h: 'Перейдите в новую вселенную', cond: () => S.uniResets >= 1,
    x: 'Сброс, которого вы боялись, не уничтожил вас. Вы в новой вселенной, но тетрадь по-прежнему лежит на столе.\n\nНа последней странице появилась запись — вашим почерком. Вы такого не писали: «Не бойся предела. Бойся не дойти».' },
  { id: 's10', t: 'Бабочка', h: 'Откройте систему Лоренца', cond: () => !!S.eq.un.lor,
    x: 'Хаос не случаен, он слишком чувствителен. Малая разница в начале — и другая судьба в конце.\n\nНуль писал: «Я изменил в уравнении один знак. Одна бабочка — и вся моя жизнь пошла иначе».' },
  { id: 's11', t: 'Топос', h: 'Дойдите до «Топосов»', cond: () => S.maxGen >= 17,
    x: 'В топосе законы логики становятся параметрами. Нуль искал такой мир, где его ошибка окажется не ошибкой.\n\nВы понимаете: он не пропал. Он ушёл вглубь.' },
  { id: 's12', t: 'Семь проблем', h: 'Решите все семь проблем тысячелетия', cond: () => allRes(),
    x: 'Закрыв последнюю проблему тысячелетия, вы обнаруживаете, что тетрадь почти заполнена. Остались последние строки, и они зависят от вас.\n\n«Чтобы дойти до предела, нужно владеть всем: каждой ступенью, каждой теорией, каждым уравнением».' },
  { id: 's13', t: 'Неподвижная точка', h: null, cond: () => S.maxGen >= NG - 1 && allRes() && allTh() && allEq(),
    x: 'Вы решили Мастер-уравнение. Оно оказалось записью одного условия: f(x) = x. Неподвижная точка — то, что отображение оставляет на месте, как бы ни менялось всё вокруг.\n\nНуль ждал на той стороне предела. И это были вы — вернувшийся с ответом, чтобы научить того, кто найдёт тетрадь.\n\nТетрадь закрывается. На обложке проступает новое имя — ваше.\n\nМатематика бесконечна. Продолжайте. (Все ваши успехи удвоены навсегда.)' }
];
let storyQ = [];
function storyCheck() {
  for (const c of STORY) if (!S.story[c.id] && !storyQ.includes(c.id) && c.cond()) storyQ.push(c.id);
  if (storyQ.length && !modalOpen()) showChapter(storyQ.shift(), true);
}
function showChapter(id, first) {
  const c = STORY.find(x => x.id === id); if (!c) return; if (first) { S.story[id] = 1; if (id === 's13' && !S.ending) { S.ending = 1; recalc(); recompute(); } }
  const n = STORY.indexOf(c);
  modal('<h3></h3><div class="mut" style="margin-bottom:8px">' + (n ? 'Глава ' + n : 'Пролог') + '</div><div class="stx"></div>', [{ t: first ? 'Читать дальше' : 'Закрыть', cls: 'pri' }]);
  const m = el('modal'); m.querySelector('h3').textContent = c.t; m.querySelector('.stx').innerHTML = c.x.split('\n\n').map(p => '<p></p>').join('');
  m.querySelectorAll('.stx p').forEach((p, i) => { p.textContent = c.x.split('\n\n')[i]; });
}
function storyGoal() {
  for (const c of STORY) if (!S.story[c.id]) { if (c.id === 's13') { const m = finalMissing(); return 'Финал близко. Осталось: ' + m.join('; '); } return c.h; }
  return 'Вы дошли до предела. Дальше — только бесконечность.';
}
function chapterList() {
  let h = '<h3>Летопись</h3>';
  STORY.forEach((c, i) => { if (S.story[c.id]) h += '<p><b>Глава ' + i + '. ' + c.t + '</b></p><p class="mut">' + c.x.replace(/\n\n/g, '</p><p class="mut">') + '</p>'; });
  modal(h, [{ t: 'Закрыть' }]);
}

/* =====================================================================
   ЗАПУСК
   ===================================================================== */
function dailyCheck(had) {
  const day = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000), d = S.daily;
  if (d.d === day) return '';
  const streak = d.d === day - 1 ? d.streak + 1 : 1; S.daily = { d: day, streak };
  if (!had) return '';
  const v = Math.max(CPS * 1800 * Math.min(streak, 7), 150 * streak); addK(v); addBuff('daily', 'Бодрое утро ×2', 300, { prod: 2 });
  return '<p><b>Ежедневный бонус, день ' + streak + ':</b> +' + fmt(v) + ' знания и ×2 к производству на 5 минут.</p>';
}
function init() {
  const had = load(); recalc(); recompute();
  buildGens(); buildTheories(); buildEq(); buildCharts(); buildGrow(); buildUni(); buildAch(); buildRes(); buildQuests(); buildMaths(); buildMenu();
  while (S.quests.length < 3) S.quests.push(newQuest());
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => setTab(b.dataset.t));
  document.querySelectorAll('#buyseg button').forEach(b => b.onclick = () => { S.buyMode = b.dataset.m; updateUI(true); });
  el('sciseg').querySelectorAll('button').forEach(b => b.onclick = () => { setSub('sci', b.dataset.s); if (b.dataset.s === 'ch') chT = 9; });
  el('growseg').querySelectorAll('button').forEach(b => b.onclick = () => setSub('grow', b.dataset.s));
  el("goalsseg").querySelectorAll('button').forEach(b => b.onclick = () => setSub('goals', b.dataset.s));
  const pb = el('proof');
  pb.addEventListener('pointerdown', e => {
    e.preventDefault(); recompute(); const v = clickVal(); addK(v); S.clicks++; floatTxt(e.clientX, e.clientY - 20, '+' + fmt(v)); vib(6);
    pb.classList.add('press'); setTimeout(() => pb.classList.remove('press'), 70); el('kVal').textContent = fmt(S.k);
  });
  pb.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const v = clickVal(); addK(v); S.clicks++; } });
  el('orb').onclick = claimOrb;
  try {
    const cv = document.createElement('canvas'); cv.width = cv.height = 512; const cx = cv.getContext('2d');
    cx.fillStyle = '#0d1230'; cx.fillRect(0, 0, 512, 512);
    const gr = cx.createRadialGradient(190, 170, 20, 256, 256, 220); gr.addColorStop(0, '#fbe3a6'); gr.addColorStop(.55, '#ee9d2f'); gr.addColorStop(1, '#5a3508');
    cx.fillStyle = gr; cx.beginPath(); cx.arc(256, 256, 190, 0, 7); cx.fill();
    cx.fillStyle = '#0c1129'; cx.font = '600 230px Georgia,serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('∞', 256, 262);
    const icon = cv.toDataURL('image/png');
    const man = { name: 'Предел', short_name: 'Предел', start_url: location.href, display: 'standalone', background_color: '#0d1230', theme_color: '#0d1230', icons: [{ src: icon, sizes: '512x512', type: 'image/png', purpose: 'any' }] };
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' })); document.head.appendChild(l);
    const a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = icon; document.head.appendChild(a);
  } catch (e) { }
  let away = 0;
  if (had) { away = (Date.now() - S.last) / 1000; }
  lastT = NOW(); evT = rnd(30, 60);
  const parts = [];
  if (away > 5) { const g = offline(away); if (away > 90) parts.push('<p>Вас не было ' + fmtT(away) + '. За это время накоплено <b>' + fmt(g) + '</b> знания.</p>'); }
  const dl = dailyCheck(had); if (dl) parts.push(dl);
  if (had && S.seenVer < 3) { parts.push(CHANGELOG); STORY.forEach(c => { if (c.id !== 's13' && c.cond()) S.story[c.id] = 1; }); }
  S.seenVer = 3;
  if (parts.length) modal('<h3>С возвращением!</h3>' + parts.join(''), [{ t: 'Отлично', cls: 'pri' }]);
  checkRes(); checkAch(); recompute(); setSub('grow', 'ax'); setSub('goals', 'ach'); setSub('sci', 'th'); setTab('theory');
  setInterval(loop, 100);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  if (!had) setTimeout(help, 400);
}
init();
